spring:
  application:
    name: spring-lab
  datasource:
    url: jdbc:h2:file:./data/springlab
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  owner: Daniyar Aibubi
  group: IT1CCO-2502 IS
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  locale:
    default-locale: ru
    supported:
      - ru
      - kk
      - en

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions